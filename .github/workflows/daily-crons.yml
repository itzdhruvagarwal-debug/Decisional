name: Scheduled Daily & Weekly Maintenance Crons

on:
  schedule:
    # Runs daily at 04:00 UTC (09:30 AM IST)
    - cron: "0 4 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  run-daily-crons:
    name: Execute Maintenance Crons
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Post Monitor
        run: |
          echo "Running post-monitor cron..."
          curl -s -f -X GET "https://vyaparmedia-nine.vercel.app/api/cron/post-monitor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'f728a8d47e08e2d683f324de1d7dfd92e165b8f939b074b7fb477742c9c31a3a' }}" || true

      - name: Trigger Stale Fulfillment Scanner
        run: |
          echo "Running stale-fulfillment cron..."
          curl -s -f -X GET "https://vyaparmedia-nine.vercel.app/api/cron/stale-fulfillment" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'f728a8d47e08e2d683f324de1d7dfd92e165b8f939b074b7fb477742c9c31a3a' }}" || true

      - name: Trigger Creator Tenure & Milestone Badges
        run: |
          echo "Running tenure-badges cron..."
          curl -s -f -X GET "https://vyaparmedia-nine.vercel.app/api/cron/tenure-badges" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'f728a8d47e08e2d683f324de1d7dfd92e165b8f939b074b7fb477742c9c31a3a' }}" || true

      - name: Trigger Weekly Challenges Generator
        run: |
          echo "Running weekly-challenges cron..."
          curl -s -f -X GET "https://vyaparmedia-nine.vercel.app/api/cron/weekly-challenges" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'f728a8d47e08e2d683f324de1d7dfd92e165b8f939b074b7fb477742c9c31a3a' }}" || true

      - name: Trigger Social Proof & Authenticity Recalculation
        run: |
          echo "Running social-proof cron..."
          curl -s -f -X GET "https://vyaparmedia-nine.vercel.app/api/cron/social-proof" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'f728a8d47e08e2d683f324de1d7dfd92e165b8f939b074b7fb477742c9c31a3a' }}" || true

      - name: Log Cron Completion
        run: echo "✅ All scheduled maintenance crons triggered successfully!"
